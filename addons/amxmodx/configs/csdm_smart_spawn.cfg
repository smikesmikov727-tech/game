// ==================================================
// CSDM Smart Spawn - Конфигурация
// ==================================================
// Умное рандомное распределение игроков по карте
// ==================================================

// Включить/выключить плагин
// 0 = выключен, 1 = включен
csdm_smart_spawn 1

// Минимальное расстояние до союзников при выборе точки спавна (в единицах)
// По умолчанию: 300.0
// Рекомендуется: 200.0 - 500.0
csdm_spawn_min_dist_player 300.0

// Минимальное расстояние до врагов при выборе точки спавна (в единицах)
// По умолчанию: 500.0
// Рекомендуется: 400.0 - 800.0
csdm_spawn_min_dist_enemy 500.0

// Время (в секундах), через которое точка спавна может быть использована повторно
// По умолчанию: 5.0
// Рекомендуется: 3.0 - 10.0
csdm_spawn_reuse_time 5.0

// Автоматическая генерация точек спавна при первом запуске
// 0 = выключена, 1 = включена
// По умолчанию: 1
csdm_spawn_autogenerate 1

// ==================================================
// Дополнительная информация
// ==================================================
//
// Команды администратора (требуется ADMIN_MAP):
// - csdm_addspawn       : Добавить точку спавна в текущей позиции
// - csdm_delspawn       : Удалить ближайшую точку спавна
// - csdm_savespawns     : Сохранить точки спавна для текущей карты
// - csdm_loadspawns     : Загрузить точки спавна для текущей карты
// - csdm_clearspawns    : Очистить все точки спавна
// - csdm_showspawns     : Показать информацию о спавнах в консоли
//
// Файлы точек спавна сохраняются в:
// addons/amxmodx/configs/csdm_spawns/<mapname>.spawns
//
// ==================================================
