// ============================================
// CAPTURE POINTS v22 - Конфигурация
// ============================================

// Количество точек захвата на карте (1-16)
cp_points_count "7"

// Время захвата точки в секундах
cp_capture_time "8"

// Награда команде за захват точки ($)
cp_capture_reward "500"

// Бонус игроку за отбитие вражеской точки ($)
cp_recapture_bonus "700"

// Минимальное расстояние между точками (units)
cp_min_distance "400"

// Минимальное расстояние от баз спавна (units)
cp_base_distance "200"

// Радиус захвата точки (units)
cp_capture_radius "120"

// ============================================
// СИСТЕМА СПАВНА
// ============================================

// Включить спавн на точках (0 - выкл, 1 - вкл)
cp_spawn_on_points "1"

// Режим спавна:
// 0 = только база (стандартный CS)
// 1 = случайный (50% база, 50% точки)
// 2 = умный (место смерти → последняя захваченная → точки → база)
// 3 = стратегический (концентрация на фронте или защита)
cp_spawn_mode "2"

// ============================================
// ЭФФЕКТЫ
// ============================================

// Показывать HUD при захвате (0 - выкл, 1 - вкл)
cp_show_hud "1"

// Звук при захвате точки (0 - выкл, 1 - вкл)
cp_capture_sound "1"

// Визуальный эффект при захвате (0 - выкл, 1 - вкл)
cp_capture_effect "1"

// ============================================
// ОПИСАНИЕ РЕЖИМОВ СПАВНА
// ============================================
//
// Режим 0 (Только база):
//   Игроки всегда спавнятся на стандартных точках CS
//
// Режим 1 (Случайный):
//   50% шанс спавна на базе
//   50% шанс спавна на случайной захваченной точке
//
// Режим 2 (Умный) - РЕКОМЕНДУЕТСЯ:
//   Приоритет 1: Рядом с местом смерти (если есть своя точка в радиусе 500 юнитов)
//   Приоритет 2: На последней захваченной игроком точке
//   Приоритет 3: На точке с наименьшим количеством игроков
//   Если ничего не подходит - на базе
//
// Режим 3 (Стратегический):
//   Если команда проигрывает - спавн на передовых точках (ближе к врагу)
//   Если команда выигрывает - равномерное распределение для защиты
//
