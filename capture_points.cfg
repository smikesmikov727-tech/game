// ============================================================================
// CAPTURE POINTS v22 - Конфигурация
// ============================================================================

// --- ОСНОВНЫЕ НАСТРОЙКИ ---

// Количество точек захвата на карте (1-16)
cp_points_count "7"

// Время захвата точки в секундах
cp_capture_time "8"

// Радиус захвата точки (в юнитах)
cp_capture_radius "120"

// --- НАГРАДЫ ---

// Награда всей команде за захват точки ($)
cp_capture_reward "500"

// Бонус захватчику за отбитие вражеской точки ($)
cp_recapture_bonus "700"

// --- РАССТОЯНИЯ ---

// Минимальное расстояние между точками захвата
cp_min_distance "400"

// Минимальное расстояние от баз команд для размещения точек
cp_base_distance "200"

// --- СИСТЕМА СПАВНА ---

// Максимум игроков, которые могут заспавниться на одной захваченной точке
// Остальные игроки появятся в случайных местах карты
cp_spawn_per_point "2"

// --- УСЛОВИЯ ПОБЕДЫ ---

// Количество точек для победы в раунде (0 = отключено)
// При достижении этого количества команда побеждает
cp_win_points "5"

// Время для оспаривания точки (секунды, для будущих обновлений)
cp_contest_time "3"

// --- ИНТЕРФЕЙС ---

// Показывать HUD с прогрессом захвата (0/1)
cp_show_hud "1"

// --- ЭФФЕКТЫ ---

// Воспроизводить звуки при захвате (0/1)
cp_capture_sound "1"

// Показывать визуальные эффекты при захвате (0/1)
cp_capture_effect "1"

// ============================================================================
// КОМАНДЫ ИГРОКОВ:
// /cp - показать текущий счёт точек
// ============================================================================
