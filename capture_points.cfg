// ============================================
// CAPTURE POINTS v21 - Конфигурация
// ============================================

// Количество точек захвата на карте (1-16)
cp_points_count "7"

// Время захвата точки в секундах
cp_capture_time "8"

// Награда команде за захват точки ($)
cp_capture_reward "500"

// Бонус игроку за отбитие вражеской точки ($)
cp_recapture_bonus "700"

// Минимальное расстояние между точками (units)
cp_min_distance "400"

// Минимальное расстояние от баз спавна (units)
cp_base_distance "200"

// Радиус захвата точки (units)
cp_capture_radius "120"

// ============================================
// СИСТЕМА СПАВНА
// ============================================

// Спавн на захваченных точках (0 - выкл, 1 - вкл)
cp_spawn_on_points "1"

// Баланс спавна (0-100)
// 0 = всегда на базе
// 50 = 50% база, 50% точки
// 100 = всегда на точках (если есть захваченные)
// Рекомендуется: 50-70
cp_spawn_balance "60"

// ============================================
// ЭФФЕКТЫ
// ============================================

// Показывать HUD при захвате (0 - выкл, 1 - вкл)
cp_show_hud "1"

// Звук при захвате точки (0 - выкл, 1 - вкл)
cp_capture_sound "1"

// Визуальный эффект при захвате (0 - выкл, 1 - вкл)
cp_capture_effect "1"
